<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용 스킬트리 — 오각형 방사형 프로토타입</title>
<style>
  :root{
    --bg:#0e0a0a; --panel:#1a1414; --line:#3a2f2b; --ink:#e6ddd4; --muted:#8f8175;
    --kin:#8fd14f; --lock:#4a3f39;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Malgun Gothic",sans-serif;padding:18px}
  h1{font-size:19px;font-weight:600;text-align:center;letter-spacing:1.5px;color:#f3e9de}
  .sub{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 12px}
  .wrap{max-width:1040px;margin:0 auto}
  .bar{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}
  .stat{font-size:13px;color:var(--ink)}
  .stat b{color:var(--kin);font-size:16px}
  .btn{padding:6px 16px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
       border-radius:6px;cursor:pointer;font-size:12px}
  .btn:hover{color:var(--ink);border-color:#e08a3c}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;
         background:radial-gradient(circle at 50% 46%,#1a1310,#0b0807 70%);overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .info{min-height:44px;margin-top:10px;padding:10px 14px;border:1px solid var(--line);
        border-radius:8px;background:var(--panel);font-size:12.5px;line-height:1.5;color:var(--muted)}
  .info b{color:#f3e9de}
  .legend{text-align:center;color:var(--muted);font-size:11px;margin-top:10px;line-height:1.7}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin:0 3px 0 10px}
  .node-g{cursor:pointer}
  .node-g text{pointer-events:none;user-select:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>용 스킬트리 — 오각형 방사형 프로토타입</h1>
  <div class="sub">중앙 오각형(5속성)에서 어미용 가지가 뻗어나감 · 상위 어미용 노드는 <b style="color:#8fd14f">새끼용 노드 N개 해금</b>을 선행으로 요구</div>

  <div class="bar">
    <div class="stat">해금한 새끼용 노드: <b id="kinCount">0</b> / 10</div>
    <button class="btn" id="resetBtn">전체 초기화</button>
  </div>

  <div class="stage"><svg id="tree" viewBox="0 0 1000 880" role="img"
       aria-label="오각형 중심 용 스킬트리 방사형 다이어그램"></svg></div>

  <div class="info" id="info">노드를 클릭하면 해금됩니다. 선행(이전 노드)·게이팅(새끼용 N개)을 만족해야 해금 가능. 다시 클릭하면 해제됩니다.</div>

  <div class="legend">
    <span class="dot" style="background:#e08a3c"></span>어미용 각성(루트)
    <span class="dot" style="background:#c9c2b8"></span>어미용 스킬
    <span class="dot" style="background:#8fd14f"></span>새끼용 노드
    <span class="dot" style="background:#4a3f39"></span>잠김
    · 자물쇠 = 새끼용 N개 필요 · 코스트: 슬라임+특화 (RP 미사용)
  </div>
</div>

<script>
const CX = 500, CY = 445;
const SVG = document.getElementById("tree");
const NS = "http://www.w3.org/2000/svg";
const rad = d => (d-90) * Math.PI/180;   // -90 = 위쪽 기준

// 5속성 (오각형 꼭짓점). angle: 위(-90)에서 시계방향 72도씩.
const ATTRS = [
  {key:"생명", ang:0,   color:"#7fd14f", passive:"농장 생산량↑", active:"바리케이드"},
  {key:"얼음", ang:72,  color:"#5bc0e0", passive:"타워 공격에 슬로우", active:"모든 적 빙결"},
  {key:"불",   ang:144, color:"#e0603c", passive:"모든 적에게 화상", active:"화상 가속·전역뎀"},
  {key:"시간", ang:216, color:"#b07de0", passive:"타워 공격속도↑", active:"파괴 타워 즉시 수리"},
  {key:"암석", ang:288, color:"#c9a24a", passive:"광산 생산량↑", active:"메테오"},
];

// 반지름 단계
const R_PENT = 74;      // 오각형 반지름
const R_M1 = 156;       // 어미용 각성
const R_M2 = 236, R_M3 = 316, R_M4 = 396;
const R_KIN = 210;      // 새끼용
const KIN_OFF = 24;     // 새끼용 좌우 각도 오프셋

// 노드 정의 생성
const nodes = {};   // id -> node
const edges = [];   // {from,to}
function addNode(n){ nodes[n.id]=n; return n; }

ATTRS.forEach(a=>{
  const base = a.ang;
  const pos = (r,angDeg)=>({x:CX+r*Math.cos(rad(angDeg)), y:CY+r*Math.sin(rad(angDeg))});
  const k = a.key;

  // 어미용 라인 (방사)
  const p1=pos(R_M1,base), p2=pos(R_M2,base), p3=pos(R_M3,base), p4=pos(R_M4,base);
  addNode({id:k+"_m1", attr:k, kind:"root", name:"각성", desc:`패시브: ${a.passive}`, x:p1.x,y:p1.y, color:a.color, prereq:[]});
  addNode({id:k+"_m2", attr:k, kind:"mother", name:"액티브 I", desc:`액티브: ${a.active}`, x:p2.x,y:p2.y, color:a.color, prereq:[k+"_m1"]});
  addNode({id:k+"_m3", attr:k, kind:"mother", name:"강화", desc:"패시브·액티브 수치 강화", x:p3.x,y:p3.y, color:a.color, prereq:[k+"_m2"], gateKin:2});
  addNode({id:k+"_m4", attr:k, kind:"mother", name:"궁극", desc:"속성 최종 강화", x:p4.x,y:p4.y, color:a.color, prereq:[k+"_m3"], gateKin:4});
  edges.push([k+"_m1",k+"_m2"],[k+"_m2",k+"_m3"],[k+"_m3",k+"_m4"]);

  // 새끼용 offshoot (각성에서 좌우로)
  const kp1=pos(R_KIN, base-KIN_OFF), kp2=pos(R_KIN, base+KIN_OFF);
  addNode({id:k+"_k1", attr:k, kind:"kin", name:"새끼용 A", desc:"새끼용 타워/지역 효과", x:kp1.x,y:kp1.y, color:a.color, prereq:[k+"_m1"]});
  addNode({id:k+"_k2", attr:k, kind:"kin", name:"새끼용 B", desc:"새끼용 타워/지역 효과", x:kp2.x,y:kp2.y, color:a.color, prereq:[k+"_m1"]});
  edges.push([k+"_m1",k+"_k1"],[k+"_m1",k+"_k2"]);

  // 중심 → 각성
  edges.push(["CENTER",k+"_m1"]);
});

// 상태
let unlocked = new Set();
const kinCount = () => [...unlocked].filter(id=>nodes[id].kind==="kin").length;
const prereqMet = n => n.prereq.every(p=>unlocked.has(p));
const gateMet = n => !n.gateKin || kinCount() >= n.gateKin;
const eligible = n => prereqMet(n) && gateMet(n);

// 캐스케이드: 조건 깨진 해금 노드 자동 해제
function resolve(){
  let changed=true;
  while(changed){
    changed=false;
    for(const id of [...unlocked]){
      if(!eligible(nodes[id])){ unlocked.delete(id); changed=true; }
    }
  }
}

function pentagonPoints(r){
  return ATTRS.map(a=>{
    const x=CX+r*Math.cos(rad(a.ang)), y=CY+r*Math.sin(rad(a.ang));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
}

function el(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}

function setInfo(html){ document.getElementById("info").innerHTML=html; }

function render(){
  SVG.innerHTML="";
  document.getElementById("kinCount").textContent=kinCount();

  // 간선
  edges.forEach(([f,t])=>{
    const A = f==="CENTER" ? {x:CX,y:CY} : nodes[f];
    const B = nodes[t];
    const on = (f==="CENTER" ? unlocked.has(t) : (unlocked.has(f)&&unlocked.has(t)));
    SVG.appendChild(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,
      stroke: on?nodes[t].color:"#332c28", "stroke-width": on?3:2, "stroke-opacity":on?0.9:0.5}));
  });

  // 중앙 오각형
  SVG.appendChild(el("polygon",{points:pentagonPoints(R_PENT),
    fill:"#160f0c", stroke:"#e08a3c", "stroke-width":2, "stroke-opacity":0.8}));
  SVG.appendChild(el("polygon",{points:pentagonPoints(R_PENT-9),
    fill:"none", stroke:"#e08a3c", "stroke-width":1, "stroke-opacity":0.35}));
  const c=el("text",{x:CX,y:CY-4,"text-anchor":"middle","font-size":13,fill:"#e08a3c","font-weight":"600"});
  c.textContent="어미용"; SVG.appendChild(c);
  const c2=el("text",{x:CX,y:CY+13,"text-anchor":"middle","font-size":9,fill:"#8f8175"});
  c2.textContent="5속성"; SVG.appendChild(c2);

  // 속성 라벨 (오각형 꼭짓점 근처)
  ATTRS.forEach(a=>{
    const lr=R_PENT+18;
    const lx=CX+lr*Math.cos(rad(a.ang)), ly=CY+lr*Math.sin(rad(a.ang));
    const t=el("text",{x:lx,y:ly+3,"text-anchor":"middle","font-size":11,fill:a.color,"font-weight":"600"});
    t.textContent=a.key; SVG.appendChild(t);
  });

  // 노드
  Object.values(nodes).forEach(n=>{
    const isUn = unlocked.has(n.id);
    const canGet = !isUn && eligible(n);
    const isRoot = n.kind==="root";
    const isKin = n.kind==="kin";
    const r = isKin?17 : (isRoot?27:24);

    const g=el("g",{class:"node-g"});
    let fill, stroke;
    if(isUn){
      fill = isKin ? "#2f4a1c" : (isRoot? "#3a2a18":"#2a231e");
      stroke = isKin ? "#8fd14f" : n.color;
    } else if(canGet){
      fill="#1c1613"; stroke=isKin? "#5f7a3c" : "#7a6a5c";
    } else {
      fill="#141010"; stroke="#4a3f39";
    }
    g.appendChild(el("circle",{cx:n.x,cy:n.y,r:r,fill:fill,stroke:stroke,
      "stroke-width":isUn?3:2, "stroke-opacity":isUn?1:(canGet?0.9:0.5)}));

    // 이름
    const nameFill = isUn? "#f3e9de" : (canGet? "#c8bcae":"#6a5f57");
    const nm=el("text",{x:n.x,y:n.y+3,"text-anchor":"middle","font-size":isKin?9:10,
      fill:nameFill,"font-weight":"600"});
    nm.textContent=n.name; g.appendChild(nm);

    // 게이트 자물쇠 배지
    if(n.gateKin && !isUn && !gateMet(n)){
      const bx=n.x, by=n.y+r+11;
      const bt=el("text",{x:bx,y:by,"text-anchor":"middle","font-size":9,fill:"#e0a04c"});
      bt.textContent=`🔒 새끼용 ${n.gateKin}`; g.appendChild(bt);
    } else if(n.gateKin){
      const bt=el("text",{x:n.x,y:n.y+r+11,"text-anchor":"middle","font-size":8.5,fill:"#8f8175"});
      bt.textContent=`새끼용 ${n.gateKin} 필요`; g.appendChild(bt);
    }

    g.addEventListener("click",()=>onClick(n));
    g.addEventListener("mouseenter",()=>hover(n));
    SVG.appendChild(g);
  });
}

function hover(n){
  const label = n.kind==="kin"?"새끼용":(n.kind==="root"?"어미용 각성":"어미용");
  let gate = n.gateKin? ` · <b>선행: 새끼용 ${n.gateKin}개 해금</b>`:"";
  setInfo(`<b>[${n.attr}] ${n.name}</b> (${label}) — ${n.desc}${gate}`);
}

function onClick(n){
  if(unlocked.has(n.id)){
    unlocked.delete(n.id); resolve(); render();
    setInfo(`<b>[${n.attr}] ${n.name}</b> 해제됨.`);
    return;
  }
  if(!prereqMet(n)){
    render(); setInfo(`<b>[${n.attr}] ${n.name}</b> — 선행 노드를 먼저 해금하세요.`); return;
  }
  if(!gateMet(n)){
    render(); setInfo(`<b>[${n.attr}] ${n.name}</b> — 잠김: 새끼용 노드 <b>${n.gateKin}개</b> 해금 필요 (현재 ${kinCount()}개).`); return;
  }
  unlocked.add(n.id); resolve(); render();
  hover(n);
}

document.getElementById("resetBtn").addEventListener("click",()=>{
  unlocked=new Set(); render();
  setInfo("전체 초기화 완료.");
});

render();
</script>
</body>
</html>

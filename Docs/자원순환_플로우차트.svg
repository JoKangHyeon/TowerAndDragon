<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8699"/></marker>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FBF7F"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C96A6A"/></marker>
  </defs>

  <rect x="0" y="0" width="1800" height="880" fill="#141824"/>

  <!-- ===== feedback rails (dashed) ===== -->
  <!-- D(건설) -> A(초원) : top rail -->
  <path d="M1380,110 L1380,80 L44,80 L44,205 L56,205" fill="none" stroke="#8FBF7F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrF)"/>
  <text x="712" y="71" fill="#8FBF7F" font-size="14" text-anchor="middle">생산 시설 확충 → 생산량 증가</text>
  <!-- E(연구) -> B(특화) : top rail 2 -->
  <path d="M1540,284 L1565,284 L1565,52 L28,52 L28,385 L56,385" fill="none" stroke="#8FBF7F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrF)"/>
  <text x="712" y="43" fill="#8FBF7F" font-size="14" text-anchor="middle">외곽 기초 생산 해금 · 생산 효율 강화</text>
  <!-- F(점령 출격) -> C(점령 보상) : bottom rail -->
  <path d="M1540,435 L1578,435 L1578,740 L30,740 L30,620 L56,620" fill="none" stroke="#8FBF7F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrF)"/>
  <text x="800" y="731" fill="#8FBF7F" font-size="14" text-anchor="middle">새 지역 점령 → 자원지 · 인구 확장</text>
  <!-- C(점령 보상) -> H(인구 유지비) : bottom rail 2 -->
  <path d="M210,660 L210,800 L1380,800 L1380,712" fill="none" stroke="#C96A6A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrR)"/>
  <text x="800" y="791" fill="#C96A6A" font-size="14" text-anchor="middle">점령으로 인구가 늘수록 유지비 증가</text>
  <!-- F -> R : 위험 -->
  <path d="M1540,410 L1596,410" fill="none" stroke="#C96A6A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrR)"/>
  <text x="1690" y="352" fill="#C96A6A" font-size="13" text-anchor="middle">땅의 가치에 비례</text>

  <!-- ===== main flow (solid) ===== -->
  <path d="M360,205 C430,205 390,405 444,405" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M360,405 L444,405" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M360,605 C430,605 390,405 444,405" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M770,405 C810,405 815,410 854,410" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1120,410 C1175,410 1165,158 1214,158" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1120,410 C1175,410 1165,284 1214,284" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1120,410 L1214,410" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1120,410 C1175,410 1165,536 1214,536" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1120,410 C1175,410 1165,662 1214,662" fill="none" stroke="#7d8699" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M1540,536 L1614,536" fill="none" stroke="#D9A94F" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- ===== sources ===== -->
  <g>
    <rect x="60" y="150" width="300" height="110" rx="12" fill="#1E3324" stroke="#8FBF7F" stroke-width="2"/>
    <text x="210" y="199" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">중앙 초원</text>
    <text x="210" y="228" fill="#9AA3B5" font-size="14" text-anchor="middle">기본 자원 4종 (연구 없이 생산)</text>

    <rect x="60" y="350" width="300" height="110" rx="12" fill="#1E3324" stroke="#8FBF7F" stroke-width="2"/>
    <text x="210" y="399" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">외곽 특화 영역</text>
    <text x="210" y="428" fill="#9AA3B5" font-size="14" text-anchor="middle">특화 자원 4종 (점령 필요)</text>

    <rect x="60" y="550" width="300" height="110" rx="12" fill="#1E3324" stroke="#8FBF7F" stroke-width="2"/>
    <text x="210" y="599" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">점령 보상</text>
    <text x="210" y="628" fill="#9AA3B5" font-size="14" text-anchor="middle">대각선 자원 지대 · 지역 인구</text>
  </g>

  <!-- ===== 낮 종료 (hexagon) ===== -->
  <polygon points="450,405 480,345 740,345 770,405 740,465 480,465" fill="#2B2140" stroke="#B08FD8" stroke-width="2"/>
  <text x="610" y="398" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">낮 종료 — 자원 정산</text>
  <text x="610" y="427" fill="#B08FD8" font-size="14" text-anchor="middle">낮이 끝나야 자원이 들어온다</text>

  <!-- ===== 보유 자원 (cylinder) ===== -->
  <path d="M860,354 V456 A130,16 0 0 0 1120,456 V354" fill="#252D40" stroke="#7FB3D1" stroke-width="2"/>
  <ellipse cx="990" cy="354" rx="130" ry="16" fill="#252D40" stroke="#7FB3D1" stroke-width="2"/>
  <text x="990" y="404" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">보유 자원</text>
  <text x="990" y="432" fill="#9AA3B5" font-size="14" text-anchor="middle">기본 4종 + 특화 4종</text>

  <!-- ===== sinks ===== -->
  <g>
    <rect x="1220" y="110" width="320" height="96" rx="12" fill="#33241C" stroke="#E8834F" stroke-width="2"/>
    <text x="1380" y="152" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">건설</text>
    <text x="1380" y="180" fill="#9AA3B5" font-size="14" text-anchor="middle">타워 · 생산 시설 · 주둔지 강화</text>

    <rect x="1220" y="236" width="320" height="96" rx="12" fill="#33241C" stroke="#E8834F" stroke-width="2"/>
    <text x="1380" y="278" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">연구</text>
    <text x="1380" y="306" fill="#9AA3B5" font-size="14" text-anchor="middle">용 / 타워 / 생산 / 편의</text>

    <rect x="1220" y="362" width="320" height="96" rx="12" fill="#33241C" stroke="#E8834F" stroke-width="2"/>
    <text x="1380" y="404" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">점령 출격</text>
    <text x="1380" y="432" fill="#9AA3B5" font-size="14" text-anchor="middle">인구 + 재료 (말 · 나무 · 돌)</text>

    <rect x="1220" y="488" width="320" height="96" rx="12" fill="#33241C" stroke="#E8834F" stroke-width="2"/>
    <text x="1380" y="530" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">봉인석 건설 · 성 수리</text>
    <text x="1380" y="558" fill="#9AA3B5" font-size="14" text-anchor="middle">다량 재화 소모</text>

    <rect x="1220" y="614" width="320" height="96" rx="12" fill="#33241C" stroke="#E8834F" stroke-width="2"/>
    <text x="1380" y="656" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">인구 유지비</text>
    <text x="1380" y="684" fill="#9AA3B5" font-size="14" text-anchor="middle">식량 소모 (보유 인구에 비례)</text>
  </g>

  <!-- ===== 승리 / 리스크 ===== -->
  <circle cx="1690" cy="536" r="70" fill="#332B1C" stroke="#D9A94F" stroke-width="2.5"/>
  <text x="1690" y="530" fill="#EDE9E0" font-size="20" font-weight="bold" text-anchor="middle">승리</text>
  <text x="1690" y="558" fill="#D9A94F" font-size="13" text-anchor="middle">4포탈 동시 봉인</text>

  <rect x="1600" y="365" width="180" height="90" rx="12" fill="#331C1C" stroke="#C96A6A" stroke-width="2"/>
  <text x="1690" y="401" fill="#E39A9A" font-size="16" font-weight="bold" text-anchor="middle">적 난이도 상승</text>
  <text x="1690" y="426" fill="#C96A6A" font-size="13" text-anchor="middle">밤 방어 부담 증가</text>

  <!-- ===== legend / title ===== -->
  <g font-size="13">
    <line x1="1620" y1="90" x2="1660" y2="90" stroke="#7d8699" stroke-width="2.5"/>
    <text x="1668" y="95" fill="#9AA3B5">자원 흐름</text>
    <line x1="1620" y1="112" x2="1660" y2="112" stroke="#8FBF7F" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1668" y="117" fill="#9AA3B5">피드백 (확장)</text>
    <line x1="1620" y1="134" x2="1660" y2="134" stroke="#C96A6A" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1668" y="139" fill="#9AA3B5">리스크 · 비용 증가</text>
  </g>
  <text x="60" y="852" fill="#9AA3B5" font-size="15">Tower and Dragons — 자원 순환 플로우 (생산 → 낮 종료 정산 → 보유 → 소모)</text>
</svg>
